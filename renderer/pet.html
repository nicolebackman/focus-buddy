<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Focus Buddy</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { background: transparent; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; }
  .bubble {
    max-width: 214px; background: var(--card); color: var(--ink); border-radius: 18px; padding: 9px 14px;
    font-family: var(--display); font-size: 13px; font-weight: 600; line-height: 1.3; text-align: center; text-wrap: balance;
    box-shadow: var(--shadow); position: relative; margin-bottom: 10px;
    opacity: 0; transform: translateY(6px) scale(.95); transition: opacity .25s, transform .3s cubic-bezier(.3,1.4,.5,1); pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 14px; height: 14px; background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 0 0 4px 0; }
  .buddy { position: relative; width: 120px; height: 128px; cursor: grab; }
  .buddy.dragging { cursor: grabbing; }
  .buddy .aura { inset: -18px -22px -6px; opacity: 0; }
  body.mode-focus .buddy .aura, body.mode-short .buddy .aura, body.mode-long .buddy .aura { opacity: .85; }
  .buddy .pet { position: absolute; inset: 0; }
  .upd { position: absolute; right: 8px; top: 14px; width: 14px; height: 14px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 3px var(--paper); }
  .pill {
    margin-top: 6px; display: inline-flex; flex-direction: column; align-items: stretch; gap: 3px; padding: 5px 12px 6px; border-radius: 999px;
    background: var(--ink); color: var(--paper); box-shadow: var(--shadow); cursor: pointer; min-width: 74px;
  }
  .pill .t { font-family: var(--display); font-weight: 700; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .pill .bar { height: 3px; border-radius: 3px; background: color-mix(in srgb, var(--paper) 22%, transparent); overflow: hidden; }
  .pill .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--pink); transition: width .5s linear; }
  body.mode-short .pill .bar i, body.mode-long .pill .bar i { background: var(--lime); }
  body.mode-idle .pill .bar { display: none; }
  body.paused .pill { opacity: .7; }
  .spark { position: absolute; left: 50%; top: 55%; pointer-events: none; animation: burst 1.3s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes burst { 0% { transform: translate(-50%,-50%) scale(.2) rotate(0); opacity: 0 } 25% { opacity: 1 } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(90deg); opacity: 0 } }
</style>
</head>
<body class="mode-idle face-idle">
  <div class="stage" id="stage">
    <div class="bubble hit" id="bubble"></div>
    <div class="buddy hit" id="buddy" title="Click for the timer · drag to move · right-click for the menu">
      <div class="aura"></div>
      <div class="pet" id="pet"></div>
      <span class="upd" id="updDot" hidden title="Update available"></span>
    </div>
    <div class="pill hit" id="pill"><span class="t" id="time">Tap me</span><span class="bar"><i id="bar"></i></span></div>
  </div>
<script src="pets.js"></script>
<script src="sounds.js"></script>
<script src="pet.js"></script>
</body>
</html>
