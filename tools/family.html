<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../renderer/theme.css">
<style>body{background:#FAF7F2;padding:20px;font-family:sans-serif} .row{display:flex;gap:18px;margin-bottom:10px} .c{width:150px;height:160px}</style>
<body class="face-idle"><div id="out"></div>
<script src="../renderer/pets.js"></script>
<script>
const faces=["idle","focus","rest","alert","proud"];
let h="";
for (const sp of Object.keys(Pets.SPECIES)) { h+='<div class="row">'; faces.forEach(f=>{h+=`<div class="c f-${f}">${Pets.petSVG(sp)}</div>`}); h+='</div>'; }
document.getElementById("out").innerHTML=h;
</script>
<style>.pet-svg .face{display:none} .f-idle .f-idle,.f-focus .f-focus,.f-rest .f-rest,.f-alert .f-alert,.f-proud .f-proud{display:inline} .pet-svg{width:100%;height:100%}</style>
